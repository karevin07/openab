[workspace]
members = ["crates/openab-core", "crates/openab-gateway", "crates/openab-mcp"]
exclude = ["openab-agent", "crates/platform-schema"]

[package]
name = "openab"
version = "0.10.0"
edition = "2021"
license = "MIT"

[dependencies]
openab-core = { path = "crates/openab-core", default-features = false }
openab-gateway = { path = "crates/openab-gateway", default-features = false, optional = true }
# OAB MCP Facade: in-process loopback Streamable HTTP MCP server, enabled by
# `[mcp]` in config.toml (OAB MCP Adapter ADR §6.2).
openab-mcp = { path = "crates/openab-mcp", optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
axum = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "model", "rustls_backend", "cache"], optional = true }

[features]
# Default: core only (Discord + Slack). Gateway ships as separate binary.
default = ["discord", "slack", "secrets-aws", "agentcore", "config-s3", "pre-seed", "filestore", "mcp"]

# Opt-in: compile all gateway adapters into a single unified binary
unified = ["telegram", "line", "feishu", "googlechat", "wecom", "teams", "acp", "lineworks"]

# Core adapters
discord = ["dep:serenity", "openab-core/discord"]
slack = ["openab-core/slack"]

# OAB MCP Facade (`[mcp]` in config.toml) plus the native MCP add-on CLIs.
# Optional so a chat-only worker built with e.g. `--features discord` does not
# compile rmcp, jsonschema, oauth2 and a second reqwest/rustls stack that it can
# never reach — the facade only ever starts when `[mcp]` is present, and a build
# without this feature reports that section as unsupported instead of ignoring it.
mcp = ["dep:openab-mcp"]

# Core optional features
secrets-aws = ["openab-core/secrets-aws"]
agentcore = ["openab-core/agentcore"]
config-s3 = ["openab-core/config-s3"]
pre-seed = ["openab-core/pre-seed"]
filestore = ["openab-core/filestore"]

# Gateway adapters (each pulls in the gateway crate + axum for embedded server)
telegram = ["dep:openab-gateway", "dep:axum", "openab-gateway/telegram"]
line = ["dep:openab-gateway", "dep:axum", "openab-gateway/line"]
feishu = ["dep:openab-gateway", "dep:axum", "openab-gateway/feishu"]
googlechat = ["dep:openab-gateway", "dep:axum", "openab-gateway/googlechat"]
wecom = ["dep:openab-gateway", "dep:axum", "openab-gateway/wecom"]
teams = ["dep:openab-gateway", "dep:axum", "openab-gateway/teams"]
acp = ["dep:openab-gateway", "dep:axum", "openab-gateway/acp", "openab-core/acp-mcp", "mcp"]
lineworks = ["dep:openab-gateway", "dep:axum", "openab-gateway/lineworks"]

# Applies workspace-wide (profiles are only honoured in the workspace root).
# Cross-crate inlining and a single codegen unit trade build time for a smaller,
# faster binary — worth it for an image that ships this on every deploy.
#
# `panic` is deliberately left at the default unwind: this is a long-running bot
# where a panic in one Tokio task kills that task, and `abort` would take the
# whole process — and every other in-flight turn — down with it.
[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
tempfile = "3.27.0"
